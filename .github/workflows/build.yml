name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build app
        run: python build.py
      - name: Smoke-test the built app
        shell: bash
        run: |
          ./dist/filescanner-cli* engines
          ./dist/filescanner-cli* scan README.md
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../FileScanner-windows.zip FileScanner.exe filescanner-cli.exe
          else
            zip -r ../FileScanner-${{ matrix.name }}.zip .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FileScanner-${{ matrix.name }}
          path: FileScanner-${{ matrix.name }}.zip

  # Every update to main publishes a permanent GitHub Release (artifacts on a
  # run are deleted after 90 days; release files are kept). The release is
  # named after __version__ in filescanner/__init__.py: bump it to start a new
  # release, otherwise the files on the current one are replaced.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=v$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' filescanner/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: File Scanner ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body: |
            Download the zip for your computer, unzip it and run **FileScanner**.

            - **Windows:** FileScanner-windows.zip, then double-click FileScanner.exe. If Windows says "Windows protected your PC", click More info, then Run anyway.
            - **macOS:** FileScanner-macos.zip
            - **Linux:** FileScanner-linux.zip
          files: FileScanner-*.zip
          overwrite_files: true
